replicaCount: 2

image:
  repository: ghcr.io/signalbeam-io/api-gateway
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.signalbeam.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

workloadIdentity:
  enabled: false
  clientId: ""

# Non-sensitive config
config:
  ASPNETCORE_ENVIRONMENT: Production
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.signalbeam:4317"

# YARP backend service URLs (injected as env vars to override appsettings)
backends:
  deviceManager: "http://device-manager.signalbeam"
  bundleOrchestrator: "http://bundle-orchestrator.signalbeam"
  telemetryProcessor: "http://telemetry-processor.signalbeam"
  identityManager: "http://identity-manager.signalbeam"
  zitadel: "http://zitadel.signalbeam:8080"

secrets: []

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics
  labels: {}
