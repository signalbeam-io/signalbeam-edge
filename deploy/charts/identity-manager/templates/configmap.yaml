apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "identity-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "identity-manager.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
