name: Build Telemetry Processor

on:
  push:
    branches: [main]
    paths:
      - 'src/TelemetryProcessor/**'
      - 'src/Shared/**'
      - 'src/SignalBeam.ServiceDefaults/**'
    tags: ['v*']
  pull_request:
    paths:
      - 'src/TelemetryProcessor/**'
      - 'src/Shared/**'
      - 'src/SignalBeam.ServiceDefaults/**'
  workflow_dispatch:

# Repo default token is read-only; the reusable build-service.yml needs
# packages: write to push to GHCR. Grant it here or the run fails at startup.
permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-service.yml
    with:
      service-name: telemetry-processor
      dockerfile: ./src/TelemetryProcessor/Dockerfile
      context: .
