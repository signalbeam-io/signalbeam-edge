name: Build Service Docker Image

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Service name for the image tag (e.g., device-manager)'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile'
        required: true
        type: string
      context:
        description: 'Docker build context'
        required: true
        type: string

jobs:
  build-docker:
    name: Build ${{ inputs.service-name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version and tags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="ghcr.io/${{ github.repository_owner }}/${{ inputs.service-name }}:${VERSION},ghcr.io/${{ github.repository_owner }}/${{ inputs.service-name }}:latest"
            PUSH=true
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            VERSION="0.1.0-dev.${{ github.run_number }}"
            TAGS="ghcr.io/${{ github.repository_owner }}/${{ inputs.service-name }}:latest"
            PUSH=true
          else
            VERSION="0.1.0-dev.${{ github.run_number }}"
            TAGS="ghcr.io/${{ github.repository_owner }}/${{ inputs.service-name }}:dev"
            PUSH=false
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAGS=$TAGS" >> $GITHUB_OUTPUT
          echo "PUSH=$PUSH" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.PUSH }}
          tags: ${{ steps.meta.outputs.TAGS }}
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
          labels: |
            org.opencontainers.image.title=SignalBeam ${{ inputs.service-name }}
            org.opencontainers.image.version=${{ steps.meta.outputs.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
