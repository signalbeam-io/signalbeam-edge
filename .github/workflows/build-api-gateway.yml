name: Build API Gateway

on:
  push:
    branches: [main]
    paths:
      - 'src/SignalBeam.ApiGateway/**'
      - 'src/SignalBeam.ServiceDefaults/**'
    tags: ['v*']
  pull_request:
    paths:
      - 'src/SignalBeam.ApiGateway/**'
      - 'src/SignalBeam.ServiceDefaults/**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-service.yml
    with:
      service-name: api-gateway
      dockerfile: ./src/SignalBeam.ApiGateway/Dockerfile
      context: .
