name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-integration-tests:
    name: .NET Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/SignalBeam.sln

      - name: Build
        run: dotnet build src/SignalBeam.sln --no-restore

      - name: Run integration tests
        run: |
          dotnet test tests/SignalBeam.DeviceManager.Tests.Integration/SignalBeam.DeviceManager.Tests.Integration.csproj --no-build --verbosity normal
          dotnet test tests/SignalBeam.TelemetryProcessor.Tests.Integration/SignalBeam.TelemetryProcessor.Tests.Integration.csproj --no-build --verbosity normal
          dotnet test tests/SignalBeam.EdgeAgent.Tests.Integration/SignalBeam.EdgeAgent.Tests.Integration.csproj --no-build --verbosity normal
