name: Build Bundle Orchestrator

on:
  push:
    branches: [main]
    paths:
      - 'src/BundleOrchestrator/**'
      - 'src/Shared/**'
      - 'src/SignalBeam.ServiceDefaults/**'
    tags: ['v*']
  pull_request:
    paths:
      - 'src/BundleOrchestrator/**'
      - 'src/Shared/**'
      - 'src/SignalBeam.ServiceDefaults/**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-service.yml
    with:
      service-name: bundle-orchestrator
      dockerfile: ./src/BundleOrchestrator/Dockerfile
      context: .
