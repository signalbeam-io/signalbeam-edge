version: 2
updates:
  # NuGet (.NET)
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns: ["Microsoft.*"]
      aspire:
        patterns: ["Aspire.*"]

  # npm (React frontend)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Terraform
  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "monthly"

  # Docker
  - package-ecosystem: "docker"
    directory: "/src"
    schedule:
      interval: "weekly"
